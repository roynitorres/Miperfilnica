{% extends "layout.html" %}

{% block content %}
<div class="container my-5" style="max-width: 450px;">
    <div class="card shadow-sm border-0 rounded-4 p-4">
        <h3 class="text-center mb-4 fw-bold">Acceso Administrativo</h3>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="username" class="form-label font-weight-bold">Usuario</label>
                <input type="text" name="username" id="username" class="form-control" placeholder="Ej: admin" required>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label font-weight-bold">Contraseña</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-bold">Ingresar al Panel</button>
        </form>
    </div>
</div>
{% endblock %}
